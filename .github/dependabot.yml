version: 2
updates:
  # Keeps the GitHub Actions used by the workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Keeps npm packages up to date. Each pull request is tested by the preview gate before it can be merged.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
